spring.application.name=tactive-tendering


# Company DataSource
spring.datasource.company.url=jdbc:postgresql://localhost:5432/tactive_tendering_company
spring.datasource.company.username=postgres
spring.datasource.company.password=password
spring.datasource.company.driver-class-name=org.postgresql.Driver

# User DataSource
spring.datasource.user.url=jdbc:postgresql://localhost:5432/tactive_tendering_user
spring.datasource.user.username=postgres
spring.datasource.user.password=password
spring.datasource.user.driver-class-name=org.postgresql.Driver

# Project DataSource
spring.datasource.project.url=jdbc:postgresql://localhost:5432/tactive_tendering_project
spring.datasource.project.username=postgres
spring.datasource.project.password=password
spring.datasource.project.driver-class-name=org.postgresql.Driver



#File storage
file.upload.path=/Documents

spring.datasource.hikari.maximum-pool-size=20
