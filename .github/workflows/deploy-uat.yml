name: Deploy Spring Boot UAT (Windows Server)

on:
  push:
    branches:
      - UAT

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Build JAR
      - name: Build JAR
        run: mvn clean package -DskipTests
        working-directory: ./tactive-tendering

      # 4. Debug info (optional but useful)
      - name: Debug Info
        run: |
          echo "Deploying to ${{ secrets.SERVER_HOST }}"
          ls -la tactive-tendering/target

      # 5. Upload stop script
      - name: Upload stop-app.bat
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT }} \
          stop-app.bat \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"E:/APP/Application/TactiveKSV/stop-app.bat"

      # 6. Stop application (FIXED)
      - name: Stop Spring Boot App
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          "cmd /c E:\APP\Application\TactiveKSV\stop-app.bat"

      # 7. Wait to ensure process stops
      - name: Wait before deploy
        run: sleep 5

      # 8. Upload JAR
      - name: Upload JAR via SCP
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT }} \
          tactive-tendering/target/*.jar \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"E:/APP/Application/TactiveKSV/tactive.jar"

      # 9. Upload start script
      - name: Upload start-app.bat
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT }} \
          start-app.bat \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"E:/APP/Application/TactiveKSV/start-app.bat"

      # 10. Start application (FIXED)
      - name: Start Spring Boot App
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          "cmd /c E:\APP\Application\TactiveKSV\start-app.bat"

      # 11. Success message
      - name: Deployment Success
        run: echo "Deployment completed successfully 🚀"
