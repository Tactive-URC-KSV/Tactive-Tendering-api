name: Deploy Spring Boot UAT (Windows Server)

on:
  push:
    branches:
      - UAT

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Build
      - name: Build JAR
        run: mvn clean package -DskipTests
        working-directory: ./tactive-tendering

      # 4. Debug
      - name: Debug Files
        run: ls -la tactive-tendering/target

      # 5. Upload stop script (ADDED -O FLAG FOR WINDOWS)
      - name: Upload stop-app.bat
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' scp -O \
            -o StrictHostKeyChecking=no \
            -P ${{ secrets.SERVER_PORT }} \
            stop-app.bat \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:E:/APP/Application/TactiveKSV/stop-app.bat"

      # 6. Stop app
      - name: Stop Spring Boot App
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' ssh \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cmd /c E:\APP\Application\TactiveKSV\stop-app.bat"

      # 7. Wait (Give Windows time to release the file lock)
      - name: Wait before deploy
        run: sleep 10

      # 8. Upload JAR (ADDED -O FLAG FOR WINDOWS)
      - name: Upload JAR
        run: |
          # Rename the executable jar to tactive.jar to avoid wildcard expansion issues in SCP
          find tactive-tendering/target -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" -exec mv {} tactive-tendering/target/tactive.jar \;
          
          sshpass -p '${{ secrets.SERVER_PASS }}' scp -O \
            -o StrictHostKeyChecking=no \
            -P ${{ secrets.SERVER_PORT }} \
            tactive-tendering/target/tactive.jar \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:E:/APP/Application/TactiveKSV/tactive.jar"

      # 9. Upload start script (ADDED -O FLAG FOR WINDOWS)
      - name: Upload start-app.bat
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' scp -O \
            -o StrictHostKeyChecking=no \
            -P ${{ secrets.SERVER_PORT }} \
            start-app.bat \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:E:/APP/Application/TactiveKSV/start-app.bat"

      # 10. Start app
      - name: Start Spring Boot App
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' ssh \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cmd /c E:\APP\Application\TactiveKSV\start-app.bat"

      # 11. Done
      - name: Deployment Success
        run: echo "Deployment completed successfully 🚀"
