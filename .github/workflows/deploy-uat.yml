name: Deploy Spring Boot UAT (Windows Server)

on:
  push:
    branches:
      - UAT   # deploy only on UAT branch push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout UAT branch
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up JDK
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Build the app (Maven) from subdirectory
      - name: Build JAR
        run: mvn clean package -DskipTests
        working-directory: ./tactive-tendering   

      # 4. Copy JAR to Windows Server
      - name: Upload JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT }}
          source: "tactive-tendering/target/*.jar"
          target: "E:/APP/Application/TactiveKSV/"   

      # 5. Restart app on Windows Server
      - name: Restart Spring Boot App
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Stopping old app..."
            powershell -Command "Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue"

            echo "Renaming latest JAR to tactive.jar..."
            powershell -Command "Copy-Item -Path 'E:/APP/Application/TactiveKSV/*.jar' -Destination 'E:/APP/Application/TactiveKSV/tactive.jar' -Force"

            echo "Starting new app..."
            powershell -Command "Start-Process -FilePath 'java' -ArgumentList '-jar E:/APP/Application/TactiveKSV/tactive.jar --spring.config.additional-location=file:E:/APP/Application/TactiveKSV/config/' -RedirectStandardOutput 'E:/APP/Application/TactiveKSV/logs/app.log' -RedirectStandardError 'E:/APP/Application/TactiveKSV/logs/app-error.log' -WindowStyle Hidden"
