name: Deploy Spring Boot UAT (Windows Server)

on:
  push:
    branches:
      - UAT

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Build Spring Boot application
      - name: Build JAR
        run: mvn clean package -DskipTests
        working-directory: ./tactive-tendering

      # 4. Verify generated JAR
      - name: Debug Files
        run: |
          echo "Generated files:"
          ls -lh tactive-tendering/target

      # 5. Test SSH connection
      - name: Test SSH Connection
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' \
            ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -p '${{ secrets.SERVER_PORT }}' \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            "whoami"

      # 6. Upload stop script
      - name: Upload stop-app.bat
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' \
            scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -P '${{ secrets.SERVER_PORT }}' \
            stop-app.bat \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:E:/APP/Application/TactiveKSV/stop-app.bat'

      # 7. Stop Spring Boot application
      - name: Stop Spring Boot App
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' \
            ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -p '${{ secrets.SERVER_PORT }}' \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            "cmd /c E:\\APP\\Application\\TactiveKSV\\stop-app.bat"

      # 8. Wait for application to stop
      - name: Wait before deploy
        run: sleep 10

      # 9. Upload new JAR
      - name: Upload JAR
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' \
            scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -P '${{ secrets.SERVER_PORT }}' \
            tactive-tendering/target/*.jar \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:E:/APP/Application/TactiveKSV/tactive.jar'

      # 10. Upload start script
      - name: Upload start-app.bat
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' \
            scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -P '${{ secrets.SERVER_PORT }}' \
            start-app.bat \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:E:/APP/Application/TactiveKSV/start-app.bat'

      # 11. Start Spring Boot application
      - name: Start Spring Boot App
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' \
            ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -p '${{ secrets.SERVER_PORT }}' \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            "cmd /c E:\\APP\\Application\\TactiveKSV\\start-app.bat"

      # 12. Deployment completed
      - name: Deployment Success
        run: echo "Deployment completed successfully 🚀"
